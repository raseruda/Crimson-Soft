name: Build Crimson Soft (winmm.dll)

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build winmm.dll
        shell: cmd
        run: |
          mkdir build
          rc /nologo /fo build\winmm.res src\winmm.rc
          ml64 /nologo /c /Fo build\winmm_forwards.obj src\winmm_forwards.asm
          cl /nologo /O2 /EHsc /std:c++17 /W3 /LD /Isrc src\winmm_mod.cpp src\winmm_exports.cpp build\winmm_forwards.obj build\winmm.res user32.lib gdi32.lib comctl32.lib /Fe:build\winmm.dll /Fo:build\ /link /DEF:src\winmm.def

      - name: Package ZIP & SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash build\winmm.dll -Algorithm SHA256).Hash
          "SHA256 (winmm.dll): $hash" | Out-File build\SHA256.txt -Encoding utf8
          Compress-Archive -Path build\winmm.dll, README.md, LICENSE -DestinationPath CrimsonSoft-v1.0.0.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonSoft-winmm-dll
          path: |
            CrimsonSoft-v1.0.0.zip
            build\SHA256.txt

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CrimsonSoft-v1.0.0.zip
            build\SHA256.txt
          generate_release_notes: true
