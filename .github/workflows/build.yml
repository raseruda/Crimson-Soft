name: Build Crimson Soft (pdh.dll & winmm.dll)

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build pdh.dll and winmm.dll
        shell: cmd
        run: |
          mkdir build
          rc /nologo /fo build\pdh.res src\pdh.rc
          ml64 /nologo /c /Fo build\pdh_forwards.obj src\pdh_forwards.asm
          cl /nologo /O2 /EHsc /std:c++17 /W3 /LD /Isrc src\pdh_mod.cpp src\pdh_exports.cpp build\pdh_forwards.obj build\pdh.res user32.lib gdi32.lib comctl32.lib /Fe:build\pdh.dll /Fo:build\ /link /DEF:src\pdh.def
          rc /nologo /fo build\winmm.res src\winmm.rc
          ml64 /nologo /c /Fo build\winmm_forwards.obj src\winmm_forwards.asm
          cl /nologo /O2 /EHsc /std:c++17 /W3 /LD /Isrc src\winmm_mod.cpp src\winmm_exports.cpp build\winmm_forwards.obj build\winmm.res user32.lib gdi32.lib comctl32.lib /Fe:build\winmm.dll /Fo:build\ /link /DEF:src\winmm.def

      - name: Package ZIPs & SHA256
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { "v1.0.1" }
          $pdhHash = (Get-FileHash build\pdh.dll -Algorithm SHA256).Hash
          $winmmHash = (Get-FileHash build\winmm.dll -Algorithm SHA256).Hash
          @(
            "SHA256 (pdh.dll):   $pdhHash"
            "SHA256 (winmm.dll): $winmmHash"
          ) | Out-File build\SHA256.txt -Encoding utf8
          Compress-Archive -Path build\pdh.dll, README.md, LICENSE -DestinationPath "CrimsonSoft-${tag}-pdh.zip" -Force
          Compress-Archive -Path build\winmm.dll, README.md, LICENSE -DestinationPath "CrimsonSoft-${tag}-winmm.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonSoft-DLLs
          path: |
            CrimsonSoft-*.zip
            build\SHA256.txt

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CrimsonSoft-*.zip
            build\SHA256.txt
          generate_release_notes: true
